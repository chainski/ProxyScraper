name: Source Status Check

# Schedule options (UTC):
# every 4 hours: "0 */4 * * *"
# every 6 hours: "0 */6 * * *"
# every 12 hours: "0 */12 * * *"
# once a day: "0 0 * * *"
# every 1 hour: "0 * * * *"


on:
  schedule:
    # 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source URLs from ProxyScraper.cpp
        id: extract
        run: |
          # Pull every L"https://..." string that is a proxy source
          grep -oE 'L"https?://[^"]+"' ProxyScraper.cpp \
            | sed 's/L"//;s/"$//' \
            | sort -u > sources.txt
          echo "count=$(wc -l < sources.txt)" >> $GITHUB_OUTPUT
          echo "Extracted $(wc -l < sources.txt) unique source URLs"

      - name: Probe sources (parallel)
        run: |
          # Check each URL for HTTP 200. Timeout 15s, follow redirects, ignore cert issues for resilience.
          # Write results to status_results.txt: URL|STATUS|ONLINE
          > status_results.txt
          total=0
          online=0
          while IFS= read -r url; do
            total=$((total+1))
            # curl -sI for headers only; -w for status code; -o /dev/null; --max-time 15; -L follow redirects
            status=$(curl -sI -o /dev/null -w "%{http_code}" --max-time 15 -L --retry 1 --retry-delay 1 "$url" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              online=$((online+1))
              echo "$url|200|YES" >> status_results.txt
            else
              echo "$url|$status|NO" >> status_results.txt
            fi
            # Progress every 10
            if [ $((total % 10)) -eq 0 ]; then
              echo "Probed $total sources so far..."
            fi
          done < sources.txt
          echo "ONLINE_COUNT=$online" >> $GITHUB_ENV
          echo "TOTAL_COUNT=$total" >> $GITHUB_ENV
          echo "Online: $online / $total"

      - name: Generate status report
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          {
            echo "# ProxyScraper Source Status"
            echo
            echo "**Last checked:** $TIMESTAMP  "
            echo "**Online sources:** ${ONLINE_COUNT} / ${TOTAL_COUNT}"
            echo
            echo "## Details"
            echo
            echo "| Source | Protocol | HTTP Status | Online |"
            echo "|--------|----------|-------------|--------|"
          } > STATUS.md

          # Sort alphabetically by URL for stable, readable output
          sort -t'|' -k1,1 status_results.txt > status_sorted.txt

          # Helper: detect protocol from URL (path + query)
          detect_protocol() {
            local url="$1"
            local lower
            lower=$(echo "$url" | tr '[:upper:]' '[:lower:]')

            # Query parameter style: protocol=socks5 or protocols=http,https
            if echo "$lower" | grep -qE '[?&]protocol(s)?='; then
              local proto
              proto=$(echo "$lower" | sed -nE 's/.*[?&]protocol(s)?=([^&]+).*/\2/p' | cut -d',' -f1 | cut -d'%' -f1)
              case "$proto" in
                http)  echo "HTTP"; return ;;
                https) echo "HTTPS"; return ;;
                socks4) echo "SOCKS4"; return ;;
                socks5) echo "SOCKS5"; return ;;
              esac
            fi

            # Path / filename style
            if echo "$lower" | grep -qE '(^|/)(http|https|socks4|socks5)([^a-z0-9]|$)'; then
              if echo "$lower" | grep -qE '(^|/)socks5([^a-z0-9]|$)'; then echo "SOCKS5"; return; fi
              if echo "$lower" | grep -qE '(^|/)socks4([^a-z0-9]|$)'; then echo "SOCKS4"; return; fi
              if echo "$lower" | grep -qE '(^|/)https([^a-z0-9]|$)'; then echo "HTTPS"; return; fi
              if echo "$lower" | grep -qE '(^|/)http([^a-z0-9]|$)'; then echo "HTTP"; return; fi
            fi

            # Filename contains the word (e.g. http_proxies.txt, HTTPS_RAW.txt, socks5-proxies.txt)
            if echo "$lower" | grep -qE 'socks5'; then echo "SOCKS5"; return; fi
            if echo "$lower" | grep -qE 'socks4'; then echo "SOCKS4"; return; fi
            if echo "$lower" | grep -qE 'https'; then echo "HTTPS"; return; fi
            if echo "$lower" | grep -qE 'http'; then echo "HTTP"; return; fi

            echo "—"
          }

          while IFS='|' read -r url status online; do
            host=$(echo "$url" | sed -E 's|https?://||; s|/.*||')
            path=$(echo "$url" | sed -E 's|https?://[^/]+/||; s|[?].*||')
            short_path=$(basename "$path" 2>/dev/null || echo "$path")

            if [ -z "$short_path" ] || [ "$short_path" = "$path" ] || [ "$short_path" = "/" ]; then
              label="$host"
            else
              label="$host"
              if echo "$host" | grep -q 'raw.githubusercontent.com'; then
                repo=$(echo "$path" | cut -d'/' -f1)
                [ -n "$repo" ] && label="$host/$repo"
              fi
            fi

            # Keep labels reasonably short for table readability
            if [ ${#label} -gt 50 ]; then
              label="${label:0:47}..."
            fi

            # Escape any pipe characters (rare)
            label=${label//|/\|}

            protocol=$(detect_protocol "$url")

            echo "| [$label]($url) | $protocol | $status | $online |" >> STATUS.md
          done < status_sorted.txt

          echo "" >> STATUS.md
          echo "Generated by status.yml workflow." >> STATUS.md

          rm -f status_sorted.txt

      - name: Commit status report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "Update status: ${ONLINE_COUNT}/${TOTAL_COUNT} online" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Source Status" >> $GITHUB_STEP_SUMMARY
          echo "**${ONLINE_COUNT} / ${TOTAL_COUNT}** sources returned HTTP 200" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report committed to STATUS.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Schedule: every 4 hours" >> $GITHUB_STEP_SUMMARY
