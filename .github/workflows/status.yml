name: Source Status Check

# Schedule options (UTC):
# every 4 hours: "0 */4 * * *"
# every 6 hours: "0 */6 * * *"
# every 12 hours: "0 */12 * * *"
# once a day: "0 0 * * *"
# every 1 hour: "0 * * * *"


on:
  schedule:
    # 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source URLs from ProxyScraper.cpp
        id: extract
        run: |
          # Pull every L"https://..." string that is a proxy source
          grep -oE 'L"https?://[^"]+"' ProxyScraper.cpp \
            | sed 's/L"//;s/"$//' \
            | sort -u > sources.txt
          echo "count=$(wc -l < sources.txt)" >> $GITHUB_OUTPUT
          echo "Extracted $(wc -l < sources.txt) unique source URLs"

      - name: Probe sources (parallel)
        run: |
          # Check each URL for HTTP 200. Timeout 15s, follow redirects, ignore cert issues for resilience.
          # Write results to status_results.txt: URL|STATUS|ONLINE
          > status_results.txt
          total=0
          online=0
          while IFS= read -r url; do
            total=$((total+1))
            # curl -sI for headers only; -w for status code; -o /dev/null; --max-time 15; -L follow redirects
            status=$(curl -sI -o /dev/null -w "%{http_code}" --max-time 15 -L --retry 1 --retry-delay 1 "$url" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              online=$((online+1))
              echo "$url|200|YES" >> status_results.txt
            else
              echo "$url|$status|NO" >> status_results.txt
            fi
            # Progress every 10
            if [ $((total % 10)) -eq 0 ]; then
              echo "Probed $total sources so far..."
            fi
          done < sources.txt
          echo "ONLINE_COUNT=$online" >> $GITHUB_ENV
          echo "TOTAL_COUNT=$total" >> $GITHUB_ENV
          echo "Online: $online / $total"

      - name: Generate status report
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          cat > STATUS.md << EOF
          # ProxyScraper Source Status

          **Last checked:** $TIMESTAMP  
          **Online sources:** ${ONLINE_COUNT} / ${TOTAL_COUNT}

          ## Details

          | Source | HTTP Status | Online |
          |--------|-------------|--------|
          EOF
          # Append rows (limit long URLs for readability)
          while IFS='|' read -r url status online; do
            short_url=$(echo "$url" | cut -c1-80)
            echo "| \`$short_url\` | $status | $online |" >> STATUS.md
          done < status_results.txt
          echo "" >> STATUS.md
          echo "Generated by status.yml workflow." >> STATUS.md

      - name: Commit status report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "Update source status: ${ONLINE_COUNT}/${TOTAL_COUNT} online [skip ci]" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Source Status" >> $GITHUB_STEP_SUMMARY
          echo "**${ONLINE_COUNT} / ${TOTAL_COUNT}** sources returned HTTP 200" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full report committed to STATUS.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Schedule: every 4 hours (edit cron in status.yml to change)" >> $GITHUB_STEP_SUMMARY